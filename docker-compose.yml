services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.27.5
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Helsinki
      - TZ=Europe/Helsinki

    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./documents:/home/node/.n8n-files:ro
